# Signatures for nwmain-linux, resolved at load time and checked offline by tools/sigcheck.
# Every entry must reference a finding in docs/re-notes.md (CLAUDE.md rule 4).
# tools/gen_signatures.py compiles this file into the library at build time.
#
# Each entry is either a symbol or a byte pattern. Prefer symbols: the client
# exports its C++ symbols (re-notes F9). Use patterns only for code with no symbol.
#
#   <key>:                        # lower_snake_case; becomes NWPAD_SIG_<KEY> in C
#     note: F<n>                  # re-notes finding id
#     symbol: _ZN10CNWCModule10TurnCameraEfi   # exported (mangled) name, resolved with dlsym
#
#   <key>:
#     note: F<n>
#     pattern: "55 48 89 e5 ?? ?? 41 57"      # hex bytes, "??" for wildcards
#
# Add `debug: true` to entries used only by the control socket; release builds
# (NWPAD_DEBUG_SURFACES=OFF) leave them out entirely.
#     offset: 0                   # added to the match address
#     expect: 1                   # required number of matches
#
# binary_sha256 is the nwmain-linux hash these signatures were built against.
# sigcheck exits non-zero if the installed binary differs (CLAUDE.md rule 7).

